[project]
name = "hanfix"
version = "0.1.0"
description = "Fix text typed in the wrong keyboard layout (Korean 2-set <-> QWERTY)"
authors = [{name = "Isaac Yong"}]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
hanfix = "hanfix.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
