name: release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  create:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - if: contains(matrix.target, 'musl')
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: upload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ext=; case "${{ matrix.target }}" in *windows*) ext=.exe ;; esac
          name="hanfix-${{ matrix.target }}$ext"
          cp "target/${{ matrix.target }}/release/hanfix$ext" "$name"
          if command -v sha256sum >/dev/null; then sha256sum "$name" > "$name.sha256"; else shasum -a 256 "$name" > "$name.sha256"; fi
          gh release upload "$GITHUB_REF_NAME" "$name" "$name.sha256" --clobber
