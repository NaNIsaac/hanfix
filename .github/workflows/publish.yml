name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'
  # Builds every wheel on pull requests that touch packaging; only a tag publishes
  pull_request:
    paths:
      - pyproject.toml
      - Cargo.toml
      - .github/workflows/publish.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        shell: bash
        # macOS wheels build only on release tags or manual dispatch
        run: |
          base='{"os":"ubuntu-latest","target":"x86_64-unknown-linux-gnu","manylinux":"auto"},{"os":"ubuntu-latest","target":"x86_64-unknown-linux-musl","manylinux":"musllinux_1_2"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-gnu","manylinux":"auto"},{"os":"ubuntu-24.04-arm","target":"aarch64-unknown-linux-musl","manylinux":"musllinux_1_2"},{"os":"windows-latest","target":"x86_64-pc-windows-msvc"},{"os":"windows-latest","target":"aarch64-pc-windows-msvc"}'
          macos='{"os":"macos-latest","target":"aarch64-apple-darwin"},{"os":"macos-latest","target":"x86_64-apple-darwin"}'
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo "matrix={\"include\":[$base,$macos]}" >> "$GITHUB_OUTPUT"
          else
            echo "matrix={\"include\":[$base]}" >> "$GITHUB_OUTPUT"
          fi

  wheels:
    needs: plan
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1.51.0
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --locked --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, Cargo.toml $version"; exit 1; }
      - uses: PyO3/maturin-action@v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist

  publish:
    needs: [wheels, sdist]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write  # PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
