name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# A newer push to a pull request replaces the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        shell: bash
        # macOS runs only on release tags or manual dispatch; Linux and Windows run on every push
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* || "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: plan
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.plan.outputs.os) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release --locked
      - run: cargo install --path . --locked
      - name: PowerShell integration
        shell: pwsh
        run: ./tests/shells.ps1
      - name: installer PATH merge
        shell: pwsh
        run: ./tests/install-path.ps1
      - name: installer (latest release)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command '$env:HANFIX_INSTALL_DIR="$env:RUNNER_TEMP\h"; ./install.ps1'
            "$RUNNER_TEMP/h/hanfix.exe" ㅣㄴ -ㅁ
          else
            HANFIX_INSTALL_DIR="$RUNNER_TEMP/h" sh install.sh
            "$RUNNER_TEMP/h/hanfix" ㅣㄴ -ㅁ
          fi
      - name: bash, zsh, fish integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          sh tests/shells.sh

  readme:
    uses: NaNIsaac/.github/.github/workflows/readme.yml@main
