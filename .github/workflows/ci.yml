name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: cargo test --release --locked
      - run: cargo install --path . --locked
      - name: PowerShell integration
        shell: pwsh
        run: ./tests/shells.ps1
      - name: installer PATH merge
        shell: pwsh
        run: ./tests/install-path.ps1
      - name: installer (latest release)
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -Command '$env:HANFIX_INSTALL_DIR="$env:RUNNER_TEMP\h"; ./install.ps1'
            "$RUNNER_TEMP/h/hanfix.exe" ㅣㄴ -ㅁ
          else
            HANFIX_INSTALL_DIR="$RUNNER_TEMP/h" sh install.sh
            "$RUNNER_TEMP/h/hanfix" ㅣㄴ -ㅁ
          fi
      - name: bash, zsh, fish integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          sh tests/shells.sh

  readme:
    uses: NaNIsaac/.github/.github/workflows/readme.yml@main
