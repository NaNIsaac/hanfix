name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked
      - run: cargo install --path . --locked
      - name: PowerShell integration
        shell: pwsh
        run: ./tests/shells.ps1
      - name: bash, zsh, fish integration
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq zsh fish
          sh tests/shells.sh
