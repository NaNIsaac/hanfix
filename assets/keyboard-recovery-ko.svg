<svg xmlns="http://www.w3.org/2000/svg" width="560" height="875" viewBox="0 0 560 875" role="img" aria-labelledby="title desc"><title id="title">hanfix · 한/영 오입력 복구</title><desc id="desc">모바일용 예시: 자판을 잘못 둔 명령어 ㅣㄴ -ㅁ가 ls -a로 복구되고 Enter로 실행하거나 Ctrl+C로 취소할 수 있습니다.</desc><rect width="560" height="875" rx="24" fill="#101827"/><text x="28" y="59" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="33" font-weight="800" fill="#f5f8fc">hanfix · 한/영 오입력 복구</text><text x="29" y="95" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="22" fill="#b7c8dc">직전 명령을 QWERTY로 되돌려 확인하고 실행</text><rect x="28" y="129" width="504" height="202" rx="18" fill="#192639" stroke="#365069" stroke-width="1.5"/><text x="48" y="165" fill="#8de9df" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700">01 · 한글 자판으로 잘못 입력</text><rect x="48" y="182" width="464" height="129" rx="12" fill="#070d17" stroke="#324053"/><circle cx="68" cy="202" r="6" fill="#fa7b80"/><circle cx="90" cy="202" r="6" fill="#f9ca73"/><circle cx="112" cy="202" r="6" fill="#69d9a4"/><text x="65" y="240" fill="#ffffff" font-family="DejaVu Sans Mono, Noto Sans Mono CJK KR, Consolas, monospace" font-size="23">$ ㅣㄴ -ㅁ</text><text x="65" y="270" fill="#ff9c9c" font-family="DejaVu Sans Mono, Noto Sans Mono CJK KR, Consolas, monospace" font-size="23">bash: ㅣㄴ: command not found</text></rect><path d="M280 333 v41" stroke="#8aa6c5" stroke-width="3" fill="none"/><path d="M271 364 l9 10 9 -10" fill="none" stroke="#8aa6c5" stroke-width="3" stroke-linecap="round"/><text x="28" y="392" fill="#b7c8dc" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="19">잘못 입력한 명령을 셸 기록에서 가져옵니다</text><rect x="28" y="406" width="504" height="202" rx="18" fill="#192639" stroke="#365069" stroke-width="1.5"/><text x="48" y="442" fill="#8de9df" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700">02 · hf 또는 ㅗㄹ 입력</text><rect x="48" y="459" width="464" height="129" rx="12" fill="#070d17" stroke="#324053"/><circle cx="68" cy="479" r="6" fill="#fa7b80"/><circle cx="90" cy="479" r="6" fill="#f9ca73"/><circle cx="112" cy="479" r="6" fill="#69d9a4"/><text x="65" y="517" fill="#ffffff" font-family="DejaVu Sans Mono, Noto Sans Mono CJK KR, Consolas, monospace" font-size="23">$ ㅗㄹ</text><text x="65" y="547" fill="#80e9b9" font-family="DejaVu Sans Mono, Noto Sans Mono CJK KR, Consolas, monospace" font-size="23">ls -a</text><text x="65" y="577" fill="#b3c6f5" font-family="DejaVu Sans Mono, Noto Sans Mono CJK KR, Consolas, monospace" font-size="23">[Enter / Ctrl+C]</text><text x="280" y="643" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="24" font-weight="700" fill="#f5f8fc">수정된 명령을 확인하세요</text><path d="M280 656 v25 M280 681 H150 V697 M280 681 H410 V697" fill="none" stroke="#8aa6c5" stroke-width="3"/><rect x="28" y="699" width="238" height="79" rx="15" fill="#163b35" stroke="#339f81"/><text x="147" y="749" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" fill="#a1f1cf">Enter · 실행</text><rect x="294" y="699" width="238" height="79" rx="15" fill="#413031" stroke="#ad777b"/><text x="413" y="749" text-anchor="middle" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="25" font-weight="700" fill="#ffcccc">Ctrl+C · 취소</text><text x="29" y="815" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="22" font-weight="700" fill="#ffca81">hf -y는 확인 없이 실행합니다</text><text x="29" y="847" font-family="Arial, Noto Sans CJK KR, sans-serif" font-size="18" fill="#9eafc5">모의 터미널 화면 · 실제 실행 캡처 아님</text></svg>